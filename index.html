<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资深测试 - Junket PR</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:"PingFang SC",sans-serif; background:#f4f6fa; padding:20px; display:flex; justify-content:center; }
        .container { max-width:820px; width:100%; background:#fff; border-radius:24px; padding:32px 30px 40px; box-shadow:0 12px 40px rgba(0,0,0,0.08); position:relative; }
        
        .lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #eef2f7;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #1a2634;
            transition: 0.2s;
        }
        .lang-toggle:hover { background: #dde2e9; }

        .header { text-align:center; border-bottom:2px solid #eef1f5; padding-bottom:20px; margin-bottom:28px; margin-top: 15px; }
        .header h1 { font-size:26px; font-weight:700; color:#1a2634; }
        .header .sub { color:#7b8a9b; font-size:15px; }
        .header .badge { display:inline-block; background:#1a2634; color:#fff; font-size:13px; padding:2px 16px; border-radius:30px; margin-top:8px; }
        
        #namePage { display: block; text-align:center; padding:40px 20px; }
        #namePage h2 { font-size:24px; color:#1a2634; margin-bottom:12px; }
        #namePage p { color:#6a7e94; margin-bottom:28px; font-size:16px; }
        #namePage input { width:100%; max-width:360px; padding:16px 20px; font-size:18px; border:2px solid #dde2e9; border-radius:14px; outline:none; transition:0.2s; font-family:inherit; }
        #namePage input:focus { border-color:#2b7be4; box-shadow:0 0 0 4px rgba(43,123,228,0.12); }
        #namePage .btn-start { margin-top:20px; padding:14px 50px; font-size:18px; background:#2b7be4; color:#fff; border:none; border-radius:40px; cursor:pointer; font-weight:600; transition:0.15s; font-family:inherit; }
        #namePage .btn-start:hover { background:#1a6ac8; transform:translateY(-2px); }
        #namePage .btn-start:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
        .name-error { color:#c73b3b; font-size:14px; margin-top:8px; display:none; }

        #quizPage { display: none; }
        .progress-area { display:flex; justify-content:space-between; align-items:center; background:#f0f3f7; padding:12px 18px; border-radius:50px; margin-bottom:28px; font-size:14px; flex-wrap:wrap; gap:8px; }
        .progress-track { flex:1; min-width:100px; height:6px; background:#dde2e9; border-radius:10px; overflow:hidden; }
        .progress-fill { height:100%; width:0%; background:#2b7be4; border-radius:10px; transition:width 0.35s; }
        .question-card { display:none; animation:fadeUp 0.3s; }
        .question-card.active { display:block; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(16px)} 100%{opacity:1;transform:translateY(0)} }
        .q-number { font-size:14px; font-weight:600; color:#2b7be4; background:#e9eff9; display:inline-block; padding:2px 14px; border-radius:30px; margin-bottom:12px; }
        .q-title { font-size:20px; font-weight:600; color:#0b1a2a; line-height:1.6; margin-bottom:20px; }
        .options { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
        .option-btn { background:#f7f9fc; border:2px solid #e4e9f0; border-radius:14px; padding:14px 20px; font-size:16px; font-weight:500; color:#1f2a36; cursor:pointer; transition:0.15s; text-align:left; display:flex; align-items:center; gap:12px; font-family:inherit; }
        .option-btn:hover:not(.disabled-opt) { background:#eef3fe; border-color:#b3c9f0; }
        .option-btn .tag { min-width:28px; font-weight:700; color:#6a7e94; }
        .option-btn.correct { background:#dff0d8; border-color:#2d8f4e; }
        .option-btn.wrong { background:#f8e1e1; border-color:#c73b3b; }
        .option-btn.reveal-correct { background:#dff0d8; border-color:#2d8f4e; }
        .option-btn.disabled-opt { cursor:default; opacity:0.85; }
        .insight-box { background:#f2f6fe; border-left:6px solid #2b7be4; border-radius:16px; padding:18px 22px; margin-top:16px; display:none; animation:fadeUp 0.3s; }
        .insight-box.show { display:block; }
        .insight-box .correct-answer { font-weight:700; font-size:17px; color:#124b2b; margin-bottom:6px; }
        .insight-box .correct-answer span { background:#2d8f4e; color:#fff; padding:0 12px; border-radius:30px; font-size:14px; margin-left:6px; }
        .insight-box .my-insight { color:#1f3348; line-height:1.7; font-size:15px; }

        .nav-area { display:flex; justify-content:space-between; margin-top:28px; gap:12px; flex-wrap:wrap; }
        .btn { background:#eef2f7; border:none; padding:12px 28px; border-radius:40px; font-weight:600; font-size:15px; color:#2c3e50; cursor:pointer; transition:0.15s; font-family:inherit; }
        .btn-primary { background:#1a2634; color:#fff; }
        .btn-primary:hover:not(:disabled) { background:#2c3e50; }
        .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
        .btn-success { background:#2d8f4e; color:#fff; }
        .btn-success:hover { background:#1f7a3e; }
        .btn-outline { background:transparent; border:2px solid #d0d8e2; }
        .btn-outline:disabled { opacity:0.3; cursor:not-allowed; }
        
        .result-box { display:none; text-align:center; padding:30px 10px 10px; }
        .result-box .big-score { font-size:58px; font-weight:800; color:#1a2634; }
        .result-box .big-score small { font-size:24px; color:#7b8a9b; }
        .result-box .msg { font-size:18px; color:#2c3e50; margin:16px 0 24px; }
        .result-box .stars { font-size:34px; letter-spacing:6px; }
        .result-review { margin-top:30px; text-align:left; border-top:3px solid #eef1f5; padding-top:30px; }
        .result-review h2 { font-size:22px; color:#1a2634; margin-bottom:20px; text-align:center; }
        .review-item { background:#f8f9fc; border-radius:16px; padding:20px 22px; margin-bottom:16px; border-left:6px solid #2d8f4e; transition:all 0.2s; }
        .review-item.wrong { border-left-color:#c73b3b; background:#fdf6f6; }
        .review-item .review-q { font-weight:600; font-size:16px; color:#0b1a2a; margin-bottom:10px; }
        .review-item .review-q .q-badge { font-size:13px; font-weight:700; padding:2px 12px; border-radius:30px; margin-left:10px; }
        .review-item .review-q .q-badge.correct-badge { background:#dff0d8; color:#2d8f4e; }
        .review-item .review-q .q-badge.wrong-badge { background:#f8e1e1; color:#c73b3b; }
        .review-item .review-options { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
        .review-item .review-opt { font-size:15px; padding:6px 14px; border-radius:8px; display:inline-block; width:fit-content; }
        .review-item .review-opt.opt-correct { background:#dff0d8; color:#1f7a3e; font-weight:600; }
        .review-item .review-opt.opt-wrong { background:#f8e1e1; color:#c73b3b; font-weight:600; border:2px solid #c73b3b; }
        .review-item .review-opt.opt-normal { color:#4a5a6a; }
        .submit-status { margin-top:16px; padding:12px; border-radius:12px; font-size:15px; display:none; }
        .submit-status.success { display:block; background:#dff0d8; color:#1f7a3e; border:1px solid #b8d9b0; }
        .submit-status.error { display:block; background:#f8e1e1; color:#c73b3b; border:1px solid #f0c0c0; }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 隐藏的音乐 -->
    <audio id="bgmAudio" loop style="display:none;">
        <source src="https://cdn.pixabay.com/download/audio/2022/02/21/audio_996e13365a.mp3?filename=beautiful-piano-music-98390.mp3" type="audio/mpeg">
    </audio>

    <!-- 语言切换按钮 -->
    <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()">🇬🇧 EN</button>

    <!-- 顶部标题 -->
    <div class="header">
        <h1 id="ui_title">🎯 资深测试</h1>
        <div class="sub" id="ui_sub">10 道 Junket PR 进阶操作</div>
        <div class="badge" id="ui_badge">⏳ 约 8 分钟完成</div>
    </div>

    <!-- 第一部分：名字输入 -->
    <div id="namePage">
        <h2 id="ui_name_title">📝 请先输入你的名字</h2>
        <p id="ui_name_sub">方便我们记录你的学习进度和成绩</p>
        <input type="text" id="userNameInput" placeholder="输入你的名字..." maxlength="20" />
        <div class="name-error" id="nameError">⚠️ 请先输入你的名字</div>
        <br />
        <button class="btn-start" id="startBtn" disabled>开始答题 →</button>
    </div>

    <!-- 第二部分：答题区 -->
    <div id="quizPage">
        <div class="progress-area">
            <span class="progress-text" id="progressLabel">第 1 / 10 题</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
            <span id="scoreLabel" style="font-weight:600;color:#2b7be4;">✅ 0 正确</span>
        </div>

        <div id="questionsWrapper"></div>

        <div class="nav-area">
            <button class="btn btn-outline" id="prevBtn" disabled>← 上一题</button>
            <button class="btn btn-primary" id="nextBtn">下一题 →</button>
        </div>
    </div>

    <!-- 第三部分：成绩页 -->
    <div class="result-box" id="resultBox">
        <div class="stars" id="resultStars">⭐⭐⭐</div>
        <div class="big-score" id="resultScore">0 <small>/ 10</small></div>
        <div class="msg" id="resultMsg">继续加油！</div>
        <div class="submit-status" id="submitStatus"></div>
        <button class="btn btn-success" id="restartBtn" style="margin-top:8px;padding:14px 40px;font-size:17px;">🔄 重新测试</button>
        <div class="result-review" id="resultReview"></div>
    </div>
</div>

<script>
// ============================================================
// 1. 翻译字典
// ============================================================
const i18n = {
    en: {
        title: "🎯 Advanced Test",
        sub: "10 Advanced Junket PR Operations",
        badge: "⏳ Approx. 8 mins to complete",
        name_title: "📝 Please enter your name first",
        name_sub: "To record your learning progress and results",
        name_placeholder: "Enter your name...",
        name_error: "⚠️ Please enter your name first",
        start_btn: "Start Quiz →",
        prev_btn: "← Previous",
        next_btn: "Next →",
        finish_btn: "Finish",
        view_result_btn: "📊 View Results",
        score_label: "✅ Correct",
        restart_btn: "🔄 Restart Test",
        q_num_prefix: "Q ",
        q_num_suffix: "",
        result_msg_perfect: "🎉 Perfect! Excellent understanding of PR basics!",
        result_msg_excellent: "👏 Excellent! Review the insights for the few details you missed.",
        result_msg_good: "📖 Good foundation. Review the insights for questions you got wrong.",
        result_msg_fair: "🧐 Core concepts need more work. Review all insights carefully.",
        result_msg_poor: "💪 Don't give up! Use the insights as your study material.",

    zh: {
        title: "🎯 资深测试",
        sub: "10 道 Junket PR 进阶操作",
        badge: "⏳ 约 8 分钟完成",
        name_title: "📝 请先输入你的名字",
        name_sub: "方便我们记录你的学习进度和成绩",
        name_placeholder: "输入你的名字...",
        name_error: "⚠️ 请先输入你的名字",
        start_btn: "开始答题 →",
        prev_btn: "← 上一题",
        next_btn: "下一题 →",
        finish_btn: "完成",
        view_result_btn: "📊 查看结果",
        score_label: "✅ 正确",
        restart_btn: "🔄 重新测试",
        q_num_prefix: "第 ",
        q_num_suffix: " 题",
        result_msg_perfect: "🎉 完美！你已经具备了专业PR的核心认知！",
        result_msg_excellent: "👏 非常优秀！只有少量细节需要再巩固！",
        result_msg_good: "📖 基础不错，建议把错题的解析再读一遍。",
        result_msg_fair: "🧐 有些核心概念还没吃透，建议重新梳理。",
        result_msg_poor: "💪 别灰心！把解析全部看完你会收获巨大。",
        result_review_title: "📋 所有题目回顾",
        insight_correct: "✅ 正确答案：",
        insight_right: "✔ 你选对了！",
        insight_wrong: "✘ 再记牢一点",
        insight_label: "💡 解析：",
        correct_text: "正确",
        wrong_text: "错误",
        unanswered_text: "未答",
        your_wrong_text: "你的错误选择",
        submitting_text: "正在提交成绩...",
        save_success: "你的成绩已成功保存！",
        save_failed: "成绩保存失败："
    }
};

let currentLang = 'zh';

function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    document.getElementById('langToggle').textContent = currentLang === 'zh' ? '🇬🇧 EN' : '🇨🇳 中文';
    applyLanguage();
    renderAll();
}

function applyLanguage() {
    const t = i18n[currentLang];
    document.getElementById('ui_title').innerText = t.title;
    document.getElementById('ui_sub').innerText = t.sub;
    document.getElementById('ui_badge').innerText = t.badge;
    document.getElementById('ui_name_title').innerText = t.name_title;
    document.getElementById('ui_name_sub').innerText = t.name_sub;
    document.getElementById('userNameInput').placeholder = t.name_placeholder;
    document.getElementById('nameError').innerText = t.name_error;
    document.getElementById('startBtn').innerText = t.start_btn;
    document.getElementById('prevBtn').innerText = t.prev_btn;
    document.getElementById('scoreLabel').innerText = t.score_label + " 0";
    document.getElementById('restartBtn').innerText = t.restart_btn;
    updateNextBtnText();
}

// ============================================================
// 2. 资深测试题目数据 (中英双语)
// ============================================================
const questions = [{
    id:1,
    title_zh: '客人要求演唱会门票发给我们，我们应该要找谁预定？',
    title_en: 'A guest asks us to arrange concert tickets. Who should we contact to book them?',
    options_zh: ['用自己手机的云顶app帮他们预定', '先确认客人是要comp ticket(免费票)还是付款买票，无论是免费还是付款买票都可以找他们的host或者regional协助预定', '在云顶演唱会机器直接购买', '叫他们自己在云顶app自己买'],
    options_en: ['Book using my own Genting app', 'Confirm if it\'s comp or paid. For either, contact their host or Regional to assist.', 'Buy directly from the concert machine.', 'Tell them to buy it themselves on the Genting app.'],
    correct: 1,
    insight_zh: 'ABC都是其中之一的解决方案但是这边B是最好的，不管无论是客人还是Marketing发给我们要求演唱会票时我们必须确定好是要免费票还是付款也可以，然后确认日期以及座位，避免预定错误和客人有争议。',
    insight_en: 'A, B, and C are possible, but B is best. Whether the guest or Marketing requests tickets, we must confirm comp or paid, date, and seats to avoid disputes.'
},{
    id:2,
    title_zh: '有客人要求comp ticket但是他的betting not eligible拿到comp的时候该怎么办？',
    title_en: 'A guest requests comp tickets, but their betting is not eligible. What should we do?',
    options_zh: ['马上联系我们的Marketing说明情况，他们会看情况来做后续决定', '直接跟老板讲没有comp ticket', '叫客人玩多点就可以多机会拿到免费票', '拖延并交给下一班的PR同事头疼'],
    options_en: ['Contact Marketing immediately; they will decide based on the situation.', 'Tell the boss there is no comp ticket.', 'Tell the guest to play more for a better chance.', 'Delay and pass it to the next shift PR.'],
    correct: 0,
    insight_zh: '这道题很多方法可以解决但是目前比较优解是A，因我们现在比较有名气的演唱会会用BOSSES名字来预定comp票来做准备，这些票是给marketing他们分配给予哪位客人的，我们需要做的事是把有要求票的客人跟他们说一声，后续他们会自行安排了。',
    insight_en: 'A is the best solution. For popular concerts, comp tickets are prepared under bosses\' names for Marketing to allocate. We just need to inform Marketing of the request, and they will arrange it.'
},{
    id:3,
    title_zh: '如果客人想玩outdoor themepark不想排队可以帮忙安排到吗？',
    title_en: 'A guest wants to play at the outdoor theme park without queuing. Can we arrange that?',
    options_zh: ['怎么可能不用排队，每个人都排队就你特别不用排队？', 'PR专业帮忙排队，这样老板就可以直接玩了', '可以联系Theme Park的人购买VIP ticket就可以不用排队玩任意outdoor设施了', '叫他们直接去云顶售票处自己询问'],
    options_en: ['Impossible, everyone queues. Why should they skip?', 'PR professionally queues for them.', 'Yes, contact Theme Park to buy VIP tickets for fast-track access.', 'Tell them to ask at the Genting ticket counter.'],
    correct: 2,
    insight_zh: '我们PR机里可以直接联系Theme Park VIP的人协助预定VIP票，普通VIP他们是有时间段安排跟别人一起一团总数大概10-14人数，如果是VVIP价钱会贵一些但是可以整团只有你们自己人，不会和其他人拼团。',
    insight_en: 'We can contact Theme Park VIP to book VIP tickets. Standard VIP joins a group of 10-14 people. VVIP is pricier but exclusive to your group.'
},{
    id:4,
    title_zh: '如果客人要求用云顶limo从KL上来RW hotel但是中途想在半山吃午餐，可行的吗？',
    title_en: 'A guest wants to take the Genting limo from KL to RW Hotel, but stop for lunch halfway up the mountain. Is this feasible?',
    options_zh: ['拒绝客人说明情况是云顶的车不是我们的车', '拒绝客人我们没有这样安排的服务', '直接无视客人的信息', '同意客人要求，并且马上联系司机告诉他等客人吃完了才继续上山'],
    options_en: ['Refuse, explain it\'s Genting\'s car, not ours.', 'Refuse, we don\'t offer such services.', 'Ignore the guest\'s message.', 'Agree and contact the driver to wait until the guest finishes lunch to continue up the mountain.'],
    correct: 3,
    insight_zh: '是可以安排到的，司机也是打工的，看你联系司机是要自己settle还是charge WC，只是这件事情必须上报给对应的Marketing同事知道毕竟会产生而外的费用。',
    insight_en: 'It can be arranged. The driver will wait. You just need to decide if you settle it yourself or charge WC. Remember to inform Marketing as it incurs extra costs.'
},{
    id:5,
    title_zh: '如果客人语音或者信息你时，发现听不清楚或者看不明白客人所表达的意思该怎么办？',
    title_en: 'If you receive a voice message or text from a guest and cannot understand what they are saying, what should you do?',
    options_zh: ['笑笑回复希望他不是在问你问题', '凭感觉回复希望感觉不会错', '找另外一个同事帮忙听然后跟着同事说的来做', '跟老板说抱歉听不到，请求他们再说一次'],
    options_en: ['Reply with a smile, hoping it\'s not a question.', 'Reply based on instinct, hoping it\'s correct.', 'Ask another colleague to listen and follow their instructions.', 'Apologize to the boss and ask them to say it again.'],
    correct: 3,
    insight_zh: 'AB就算了,C的话如果错了是不是要怪同事了？感觉就在推卸责任，所以D才是最优选，请求说多一次也好过做错一次。',
    insight_en: 'A and B are bad. C shifts responsibility. D is the best: asking again is much better than doing it wrong.'
},{
    id:6,
    title_zh: 'Check in 一次配套送两天但是客人要住三天可是不要重新check in可以的吗？',
    title_en: 'A check-in package covers two nights, but the guest wants to stay three nights without checking in again. Is this allowed?',
    options_zh: ['不可以，两天check in一次cover房间是定了的规矩来的', '可以，只要客人betting，rolling达标，我们可以申请做3rd night给他', '可以，我们另外买房间给他，需要通知marketing看下要不要跟客人收费', '不可以，客人不要重新check in我们就不帮他预定房间'],
    options_en: ['No, one check-in covers two nights. It\'s a fixed rule.', 'Yes, if betting/rolling is sufficient, we can apply for a 3rd night.', 'Yes, we can buy another room and check with Marketing if we should charge the guest.', 'No, we won\'t book rooms if they refuse to check in again.'],
    correct: 1,
    insight_zh: '只要客人betting，rolling达标我们可以帮忙找regional帮忙处理3rd Night的，如果要第四天就没办法需要重新check in，但是凡事皆有例外，有疑问可以询问看看regional。',
    insight_en: 'If betting/rolling is sufficient, we can ask Regional for a 3rd night. A 4th night requires a new check-in. Exceptions exist; ask Regional if unsure.'
},{
    id:7,

// ============================================================
// 3. 逻辑与交互代码
// ============================================================
let currentIndex = 0;
let answers = questions.map(() => ({ selected: null, answered: false }));
let score = 0;
let isAllAnswered = false;
let userName = '';

const namePage = document.getElementById('namePage');
const userNameInput = document.getElementById('userNameInput');
const nameError = document.getElementById('nameError');
const startBtn = document.getElementById('startBtn');
const quizPage = document.getElementById('quizPage');
const wrapper = document.getElementById('questionsWrapper');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const scoreLabel = document.getElementById('scoreLabel');
const resultBox = document.getElementById('resultBox');
const resultReview = document.getElementById('resultReview');
const restartBtn = document.getElementById('restartBtn');
const submitStatus = document.getElementById('submitStatus');
const bgmAudio = document.getElementById('bgmAudio');

const SUPABASE_URL = 'https://xjzjuhtkusvrnbijfgns.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqemp1aHRrdXN2cm5iaWpmZ25zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzE3MjEsImV4cCI6MjEwMjY0NzcyMX0.6TuUvFOtvFqF5TMiU_Yc-r2x_7GG8fOwzDApvoXCIPQ';

userNameInput.addEventListener('input', function() {
    startBtn.disabled = (this.value.trim().length === 0);
    if (this.value.trim().length > 0) nameError.style.display = 'none';
});

startBtn.addEventListener('click', function() {
    const val = userNameInput.value.trim();
    if (val.length === 0) {
        nameError.style.display = 'block';
        startBtn.disabled = true;
        return;
    }
    userName = val;
    startQuiz();
});

userNameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startBtn.click();
});

function startQuiz() {
    namePage.style.display = 'none';
    quizPage.style.display = 'block';
    bgmAudio.volume = 0.15;
    bgmAudio.play().catch(e => console.log("音频自动播放被浏览器拦截，需用户交互后才会播放"));
    renderAll();
}

function getText(q, type) {
    if (currentLang === 'en') {
        if (type === 'title') return q.title_en;
        if (type === 'options') return q.options_en;
        if (type === 'insight') return q.insight_en;
    } else {
        if (type === 'title') return q.title_zh;
        if (type === 'options') return q.options_zh;
        if (type === 'insight') return q.insight_zh;
    }
}

function renderAll() {
    let html = '';
    for (let i = 0; i < questions.length; i++) {
        const active = (i === currentIndex) ? 'active' : '';
        const q = questions[i];
        const data = answers[i];
        const isAnswered = data.answered;
        const labels = ['A', 'B', 'C', 'D'];
        
        const titleText = getText(q, 'title');
        const optsText = getText(q, 'options');
        const insightText = getText(q, 'insight');
        
        let card = `<div class="question-card ${active}" id="qcard-${i}"><div class="q-number">${i18n[currentLang].q_num_prefix}${i + 1} / ${questions.length}${i18n[currentLang].q_num_suffix}</div><div class="q-title">${titleText}</div><div class="options">`;
        
        optsText.forEach((opt, idx) => {
            let cls = 'option-btn';
            if (isAnswered) {
                cls += ' disabled-opt';
                if (idx === q.correct) cls += ' reveal-correct';
                else if (idx === data.selected && idx !== q.correct) cls += ' wrong';
                if (idx === data.selected && idx === q.correct) cls += ' correct';
            }
            card += `<button class="${cls}" data-optindex="${idx}" data-qindex="${i}" ${isAnswered ? 'disabled' : ''}><span class="tag">${labels[idx]}.</span> ${opt}</button>`;
        });
        card += '</div>';
        
        let insightHtml = '';
        if (isAnswered) {
            const isCorrect = (data.selected === q.correct);
            insightHtml = `<div class="insight-box show"><div class="correct-answer">${i18n[currentLang].insight_correct} ${labels[q.correct]} <span>${isCorrect ? i18n[currentLang].insight_right : i18n[currentLang].insight_wrong}</span></div><div class="my-insight"><strong>${i18n[currentLang].insight_label}</strong>${insightText}</div></div>`;
        } else {
            insightHtml = `<div class="insight-box" id="insight-${i}"></div>`;
        }
        card += insightHtml + '</div>';
        html += card;
    }
    wrapper.innerHTML = html;
    
    document.querySelectorAll('.option-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', function() {
            const qIdx = parseInt(this.dataset.qindex);
            const optIdx = parseInt(this.dataset.optindex);
            handleOptionClick(qIdx, optIdx);
        });
    });
    updateProgressAndScore();
    updateNavButtons();
}

function handleOptionClick(qIdx, optIdx) {
    if (answers[qIdx].answered) return;
    const q = questions[qIdx];
    answers[qIdx].selected = optIdx;
    answers[qIdx].answered = true;
    if (optIdx === q.correct) score += 1;
    isAllAnswered = answers.every(a => a.answered === true);
    renderAll();
    if (isAllAnswered) {
        currentIndex = questions.length - 1;
        renderAll();
        document.querySelector('.question-card.active').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function goToPrev() {
    if (currentIndex > 0) { currentIndex--; renderAll(); }
}

function goToNext() {
    if (isAllAnswered && currentIndex === questions.length - 1) {
        showResult();
        return;
    }
    if (!answers[currentIndex].answered) return;
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderAll();
    }
}

function updateNextBtnText() {
    const t = i18n[currentLang];
    const isLast = (currentIndex === questions.length - 1);
    const currentAnswered = answers[currentIndex].answered;
    if (isAllAnswered && isLast) {
        document.getElementById('nextBtn').textContent = t.view_result_btn;
        document.getElementById('nextBtn').className = 'btn btn-success';
        document.getElementById('nextBtn').disabled = false;
        return;
    }
    if (isLast && !currentAnswered) {
        document.getElementById('nextBtn').textContent = t.finish_btn;
        document.getElementById('nextBtn').className = 'btn btn-primary';
        document.getElementById('nextBtn').disabled = true;
        return;
    }
    document.getElementById('nextBtn').textContent = isLast ? t.finish_btn : t.next_btn;
    document.getElementById('nextBtn').className = 'btn btn-primary';
    document.getElementById('nextBtn').disabled = !currentAnswered;
}

function updateNavButtons() {
    prevBtn.disabled = (currentIndex === 0);
    updateNextBtnText();
}

function updateProgressAndScore() {
    const total = questions.length;
    const answeredCount = answers.filter(a => a.answered).length;
    progressLabel.textContent = `${i18n[currentLang].q_num_prefix}${currentIndex + 1} / ${total}${i18n[currentLang].q_num_suffix}`;
    progressFill.style.width = Math.min((answeredCount / total) * 100, 100) + '%';
    scoreLabel.textContent = `${i18n[currentLang].score_label} ${score}`;
}

function submitScoreToSupabase() {
    const total = questions.length;
    let wrongList = [];
    questions.forEach((q, idx) => {
        if (!answers[idx].answered || answers[idx].selected !== q.correct) {
            wrongList.push(idx + 1);
        }
    });

    const payload = {
        name: userName || '匿名用户',
        exam_type: '资深测试',
        score: score,
        total: total,
        wrong_questions: wrongList.join(', ')
    };

    submitStatus.style.display = 'block';
    submitStatus.className = 'submit-status';
    submitStatus.textContent = `⏳ ${i18n[currentLang].submitting_text}`;

    fetch(SUPABASE_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
    })
    .then(data => {
        submitStatus.className = 'submit-status success';
        submitStatus.textContent = `✅ ${userName}，${i18n[currentLang].save_success}`;
    })
    .catch(err => {
        submitStatus.className = 'submit-status error';
        submitStatus.textContent = `❌ ${i18n[currentLang].save_failed}${err.message}`;
    });
}

function showResult() {
    document.querySelectorAll('.question-card').forEach(el => el.classList.remove('active'));
    document.getElementById('quizPage').style.display = 'none'; 
    resultBox.style.display = 'block';
    bgmAudio.pause();
    
    const total = questions.length;
    const pct = Math.round((score / total) * 100);
    document.getElementById('resultScore').innerHTML = `${score} <small>/ ${total}</small>`;
    
    let stars, msg;
    const t = i18n[currentLang];
    if (pct === 100) { stars = '⭐⭐⭐⭐⭐'; msg = t.result_msg_perfect; } 
    else if (pct >= 80) { stars = '⭐⭐⭐⭐'; msg = t.result_msg_excellent; } 
    else if (pct >= 60) { stars = '⭐⭐⭐'; msg = t.result_msg_good; } 
    else if (pct >= 40) { stars = '⭐⭐'; msg = t.result_msg_fair; } 
    else { stars = '⭐'; msg = t.result_msg_poor; }
    document.getElementById('resultStars').textContent = stars;
    document.getElementById('resultMsg').textContent = msg;

    const labels = ['A', 'B', 'C', 'D'];
    let reviewHtml = `<h2>${t.result_review_title}</h2>`;
    questions.forEach((q, idx) => {
        const data = answers[idx];
        const isAnswered = data.answered;
        const isCorrect = isAnswered && (data.selected === q.correct);
        const userChoice = isAnswered ? data.selected : null;
        const statusText = isAnswered ? (isCorrect ? `✅ ${t.correct_text}` : `❌ ${t.wrong_text}`) : `⏳ ${t.unanswered_text}`;
        reviewHtml += `<div class="review-item ${isCorrect ? '' : 'wrong'}"><div class="review-q">${idx + 1}. ${getText(q, 'title')} <span class="q-badge ${isCorrect ? 'correct-badge' : 'wrong-badge'}">${statusText}</span></div><div class="review-options">`;
        
        const optsText = getText(q, 'options');
        optsText.forEach((opt, optIdx) => {
            let optClass = 'review-opt opt-normal';
            let mark = '';
            if (optIdx === q.correct) {
                optClass = 'review-opt opt-correct';
                mark = ` ✅ ${t.correct_text}`;
            }
            if (isAnswered && optIdx === userChoice && optIdx !== q.correct) {
                optClass = 'review-opt opt-wrong';
                mark = ` ❌ ${t.your_wrong_text}`;
            }
            if (isAnswered && optIdx === userChoice && optIdx === q.correct) {
                mark = ` ✅ ${t.correct_text}`;
            }
            reviewHtml += `<span class="${optClass}">${labels[optIdx]}. ${opt}${mark}</span>`;
        });
        reviewHtml += '</div>';
        reviewHtml += `<div style="margin-top:10px; padding-top:10px; border-top:1px dashed #e0e5ec; font-size:14px; color:#4a5a6a;"><strong>${t.insight_label}</strong>${getText(q, 'insight')}</div></div>`;
    });
    resultReview.innerHTML = reviewHtml;

    submitScoreToSupabase();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
    answers = questions.map(() => ({ selected: null, answered: false }));
    score = 0;
    currentIndex = 0;
    isAllAnswered = false;
    resultBox.style.display = 'none';
    document.getElementById('quizPage').style.display = 'none';
    submitStatus.style.display = 'none';
    document.getElementById('namePage').style.display = 'block';
    document.getElementById('userNameInput').value = '';
    document.getElementById('startBtn').disabled = true;
    bgmAudio.pause();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

applyLanguage();
renderAll();
prevBtn.addEventListener('click', goToPrev);
nextBtn.addEventListener('click', goToNext);
if (restartBtn) { restartBtn.addEventListener('click', restartQuiz); }
</script>
</body>
</html>
